<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход выполнен</title>
</head>
<body>
  <p>Вход выполнен. Можно закрыть это окно.</p>
  <script>
    // Сюда Яндекс и ВК возвращают пользователя после входа — в адресе
    // этой страницы лежит токен. Передаём адрес обратно в приложение.
    //
    // BroadcastChannel — общий канал для всех вкладок одного сайта.
    // Он нужен потому, что Яндекс и ВК присылают заголовок
    // Cross-Origin-Opener-Policy, из-за которого обычная связь
    // с открывшим окном (window.opener) теряется.
    try {
      new BroadcastChannel('flutter-oauth').postMessage(window.location.href);
    } catch (e) {}

    // Запасной путь — на случай, если связь всё-таки сохранилась.
    try {
      if (window.opener) {
        window.opener.postMessage(
          { 'flutter-web-auth-2': window.location.href },
          window.location.origin
        );
      }
    } catch (e) {}

    window.close();
  </script>
</body>
</html>
