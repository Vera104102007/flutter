<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_first_flutter_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>my_first_flutter_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Заставка на время загрузки.

    Веб-приложению Flutter нужно несколько секунд, чтобы скачать и
    запустить свой код. До первого кадра страница пустая и белая.
    Этот блок рисуется обычным HTML и CSS — то есть мгновенно, ещё до
    того, как Flutter вообще начнёт грузиться, — и показывает иконку
    приложения вместо белого экрана.
  -->
  <style>
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: sans-serif;
      color: #1565c0;
      z-index: 10;
    }

    #loading img {
      width: 96px;
      height: 96px;
      margin-bottom: 16px;
      /* Иконка пульсирует: видно, что приложение грузится, а не зависло. */
      animation: loading-pulse 1.2s ease-in-out infinite;
    }

    @keyframes loading-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.85); opacity: 0.55; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="Загрузка">
    <div>Загрузка приложения...</div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Flutter сам сообщает браузеру событием flutter-first-frame, что
    // первый кадр приложения нарисован. В этот момент заставку можно
    // убирать: под ней уже готовый интерфейс.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading');
      if (splash) splash.remove();
    });
  </script>
</body>
</html>
